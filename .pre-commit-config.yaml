# Pre-commit hooks for VoxelGame — keep C# sources formatted.
repos:
  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: dotnet format --verify-no-changes
        language: system
        pass_filenames: false
        types: [c#]
  - repo: local
    hooks:
      - id: no-gdscript
        name: C# only (no GDScript or GDExtension)
        language: fail
        entry: All game code is C#. Rewrite this file in C# (see AGENTS.md).
        files: '\.(gd|gdextension)$'
